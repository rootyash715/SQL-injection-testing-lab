version: '3.8'

services:
  sqli-lab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyberpunk-redteam-sqli-lab
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - lab_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  lab_data:
    driver: local

